name: Build 128x128 emoji collection
on:
  push:
    branches: [main]
    paths: ['sources.json', 'tools/**', 'requirements.txt', '.github/workflows/materialize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install -r requirements.txt
      - name: Download and normalize public source images
        run: python tools/normalize.py sources.json --workers 12 --output .
      - name: Verify all images and create download bundles
        run: |
          python tools/verify.py
          python tools/package.py
      - name: Commit verified image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 月薪猫 群友猪 packs manifest.json failures.json index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Extract verified 128x128 emoji collection'
            git push origin HEAD:main
          fi
